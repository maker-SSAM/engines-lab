<div id="viewport">
  <div id="stage">
{{SLIDES}}
  </div>

<div id="bar"></div>
<div id="hud"></div>
<div id="notes"></div>
<div id="overview"></div>
<div id="help">
  <h3>강의 조작</h3>
  <dl>
    <dt>→ · Space · 클릭</dt><dd>다음 (빌드 단계 → 다음 장)</dd>
    <dt>← · 오른쪽 클릭</dt><dd>이전</dd>
    <dt>R</dt><dd>이 단계 애니메이션 다시 보기</dd>
    <dt>N</dt><dd>발표자 노트(대본)</dd>
    <dt>O</dt><dd>전체 보기(목차)</dd>
    <dt>F</dt><dd>전체 화면</dd>
    <dt>B / W</dt><dd>검은 화면 / 흰 화면</dd>
    <dt>숫자 + Enter</dt><dd>그 장으로 이동</dd>
    <dt>좌우로 밀기</dt><dd>전자칠판에서 넘기기</dd>
    <dt>?still=1</dt><dd>주소 뒤에 붙이면 모든 단계를 펼친 정지 화면(인쇄·캡처용)</dd>
  </dl>
</div>
<div id="blank"></div>
<script>Deck.start();</script>
